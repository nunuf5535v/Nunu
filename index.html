<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>MONACO</title>
    
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;700;800&display=swap" rel="stylesheet">
    
    <style>
        
        :root {
            /* Palette */
            --bg-deep: #020204;
            --bg-glass: rgba(20, 20, 30, 0.6);
            --bg-card: rgba(255, 255, 255, 0.03);
            --bg-card-hover: rgba(255, 255, 255, 0.06);
            
            /* Accents */
            --primary: #7c3aed; /* Roxo Monaco */
            --accent: #00d4ff;  /* Azul Cyan */
            --success: #10b981;
            
            /* Typography */
            --text-main: #ffffff;
            --text-muted: #94a3b8;
            --font-stack: 'Outfit', sans-serif;
            
            /* Layout & Effects */
            --sidebar-width: 280px;
            --radius-xl: 24px;
            --radius-md: 16px;
            --blur: blur(25px);
            --border: 1px solid rgba(255, 255, 255, 0.08);
            --glow: 0 0 20px rgba(124, 58, 237, 0.25);
            
            /* Animation */
            --ease: cubic-bezier(0.23, 1, 0.32, 1);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; outline: none; }
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.1); border-radius: 10px; }
        
        body {
            background-color: var(--bg-deep);
            color: var(--text-main);
            font-family: var(--font-stack);
            height: 100vh;
            display: flex;
            overflow: hidden;
            background-image: radial-gradient(circle at 10% 20%, rgba(30, 20, 60, 0.4) 0%, transparent 60%),
                              radial-gradient(circle at 90% 80%, rgba(0, 100, 255, 0.1) 0%, transparent 50%);
        }

        
        .sidebar {
            width: var(--sidebar-width);
            height: 100%;
            background: var(--bg-glass);
            backdrop-filter: var(--blur);
            border-right: var(--border);
            display: flex;
            flex-direction: column;
            padding: 2rem 1.5rem;
            transition: transform 0.4s var(--ease);
            z-index: 100;
        }

        .brand {
            display: flex; align-items: center; gap: 12px;
            font-size: 1.5rem; font-weight: 800; letter-spacing: -0.5px;
            margin-bottom: 3rem; color: var(--text-main);
        }
        .brand i { color: var(--primary); filter: drop-shadow(0 0 10px var(--primary)); }

        .menu-label {
            font-size: 0.75rem; text-transform: uppercase; letter-spacing: 1.5px;
            color: var(--text-muted); margin: 1.5rem 0 0.8rem 0.5rem; font-weight: 700;
        }

        .nav-item {
            display: flex; align-items: center; gap: 15px;
            padding: 14px 16px; margin-bottom: 5px;
            border-radius: var(--radius-md);
            color: var(--text-muted); cursor: pointer;
            transition: all 0.3s ease; font-weight: 500;
            text-decoration: none; border: 1px solid transparent;
        }

        .nav-item:hover, .nav-item.active {
            background: rgba(124, 58, 237, 0.1);
            color: var(--text-main);
            border-color: rgba(124, 58, 237, 0.2);
        }
        .nav-item.active { box-shadow: var(--glow); }
        .nav-item i { font-size: 1.1rem; width: 24px; text-align: center; }

        
        .main-content {
            flex: 1; display: flex; flex-direction: column;
            position: relative; overflow: hidden;
        }

        header {
            padding: 1.5rem 2.5rem;
            display: flex; justify-content: space-between; align-items: center;
        }

        .welcome-text h1 { font-size: 1.8rem; font-weight: 700; }
        .welcome-text p { color: var(--accent); font-size: 0.9rem; margin-top: 4px; letter-spacing: 0.5px; }

        .date-badge {
            background: rgba(255,255,255,0.05); padding: 8px 16px;
            border-radius: 50px; border: var(--border);
            font-size: 0.85rem; color: var(--text-muted);
            display: flex; gap: 8px; align-items: center;
        }

        /* Scrollable Area */
        .content-scroll {
            flex: 1; overflow-y: auto; padding: 0 2.5rem 2.5rem 2.5rem;
        }

       
        .grid-layout {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 24px;
            animation: slideUp 0.6s var(--ease);
        }

        .card {
            background: var(--bg-card);
            border: var(--border);
            border-radius: var(--radius-xl);
            padding: 1.8rem;
            position: relative; overflow: hidden;
            transition: all 0.3s var(--ease);
            cursor: pointer;
            display: flex; flex-direction: column;
            min-height: 200px;
            text-decoration: none; /* Para links */
        }

        .card:hover {
            transform: translateY(-6px);
            background: var(--bg-card-hover);
            border-color: var(--primary);
            box-shadow: 0 15px 40px -10px rgba(0,0,0,0.6);
        }

        /* Ícone com fundo brilhante */
        .card-icon {
            width: 55px; height: 55px;
            background: linear-gradient(135deg, rgba(255,255,255,0.1), rgba(255,255,255,0.02));
            border-radius: 16px;
            display: flex; align-items: center; justify-content: center;
            font-size: 1.6rem; color: var(--text-main);
            margin-bottom: 1.5rem;
            border: 1px solid rgba(255,255,255,0.1);
        }
        .card:hover .card-icon { background: var(--primary); border-color: var(--primary); }

        .card h3 { font-size: 1.25rem; font-weight: 700; margin-bottom: 0.5rem; color: var(--text-main); }
        .card p { font-size: 0.9rem; color: var(--text-muted); line-height: 1.5; margin-bottom: 1.5rem; flex: 1; }

        .card-footer {
            display: flex; justify-content: space-between; align-items: center;
            margin-top: auto;
        }

        .tag {
            font-size: 0.75rem; padding: 5px 12px; border-radius: 20px;
            background: rgba(255,255,255,0.05); color: var(--text-muted);
            font-weight: 600; letter-spacing: 0.5px;
        }

        .action-arrow {
            width: 35px; height: 35px; border-radius: 50%;
            background: rgba(255,255,255,0.1); display: flex; align-items: center; justify-content: center;
            transition: 0.3s;
        }
        .card:hover .action-arrow { background: var(--accent); color: #000; transform: rotate(-45deg); }

        /* Widget Especial de Tempo */
        .card.special-time {
            background: linear-gradient(135deg, rgba(124, 58, 237, 0.15), rgba(0, 0, 0, 0));
            border-color: rgba(124, 58, 237, 0.4);
        }

       
        .mobile-toggle { display: none; font-size: 1.5rem; color: var(--text-main); cursor: pointer; }
        
        @media (max-width: 768px) {
            .sidebar {
                position: fixed; left: -100%; top: 0; bottom: 0; width: 85%;
                box-shadow: 0 0 50px rgba(0,0,0,0.9);
            }
            .sidebar.active { transform: translateX(100%); left: -85%; }
            
            .main-content { padding: 0; }
            header { padding: 1.2rem 1.5rem; }
            .content-scroll { padding: 1rem 1.5rem 6rem 1.5rem; } /* Padding bottom extra para mobile */
            .mobile-toggle { display: block; }
            .date-badge { display: none; } /* Ocultar data no header mobile para limpar */
            .welcome-text h1 { font-size: 1.4rem; }
            
            /* Melhoria do Grid Mobile */
            .grid-layout { grid-template-columns: 1fr; gap: 15px; }
            .card { min-height: auto; flex-direction: row; align-items: center; padding: 1.2rem; }
            .card-icon { width: 45px; height: 45px; font-size: 1.2rem; margin-bottom: 0; margin-right: 15px; }
            .card-content-wrapper { flex: 1; }
            .card p { display: none; } /* Resumo no mobile para ficar clean */
            .card h3 { margin-bottom: 4px; font-size: 1.1rem; }
            .card-footer { display: none; } /* Seta oculta no mobile lista */
        }

        @keyframes slideUp { from { opacity: 0; transform: translateY(30px); } to { opacity: 1; transform: translateY(0); } }
        
        /* Overlay para fechar menu no mobile */
        .overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.7); backdrop-filter: blur(5px);
            z-index: 90; display: none; opacity: 0; transition: 0.3s;
        }
        .overlay.active { display: block; opacity: 1; }

    </style>
</head>
<body>

    <div class="overlay" id="overlay" onclick="toggleMenu()"></div>

    <nav class="sidebar" id="sidebar">
        <div class="brand">
            <i class="fas fa-biohazard"></i> MONACO
        </div>

        <div id="nav-container"></div>
    </nav>

    <main class="main-content">
        <header>
            <div class="mobile-toggle" onclick="toggleMenu()"><i class="fas fa-bars"></i></div>
            
            <div class="welcome-text">
                <h1 id="greeting">NUNU DOMINA</h1>
                <p>NUNU AKAME TE AMA</p>
            </div>

            <div class="date-badge">
                <i class="far fa-calendar-alt"></i>
                <span id="date-display">...</span>
            </div>
        </header>

        <div class="content-scroll">
            <div id="app-container" class="grid-layout">
                </div>
        </div>
    </main>

    <script>

        const SISTEMA_CONFIG = {
            menus: [
                { id: 'dashboard', icon: 'fa-grid-2', label: 'MONACO' },
                { id: 'filmes', icon: 'fa-film', label: 'Cine Monaco' },
                { id: 'apps', icon: 'fa-layer-group', label: 'Apps & Ferramentas' },
                { id: 'scripts', icon: 'fa-code', label: 'Scripts' }
            ],

            
            conteudo: {
                dashboard: [
                    { 
                        title: "Cronologia", 
                        desc: "Visualize o tempo passado ou restante para eventos.", 
                        icon: "fa-hourglass-half", 
                        link: "/Nunu/Timemonaconunu.html",
                        tag: "Widget",
                        specialClass: "special-time"
                    },
                    { title: "Clima Tempo", desc: "Previsão meteorológica em tempo real.", icon: "fa-cloud-sun", link: "/Nunu/clima.html", tag: "App" },
                    { title: "Conversor de Moedas", desc: "Conversão de moedas em tempo real com cotações atualizadas.", icon: "fa-coins", link: "/Nunu/mncfinance.html", tag: "App" },
                    { title: "Brat Tool", desc: "Gerador de texto estilizado.", icon: "fa-font", link: "/Nunu/brat.html", tag: "Viral" },
                    { title: "Corinthians", desc: "Acompanhe o Timão.", icon: "fa-futbol", link: "/Nunu/corinthians.html", tag: "Sport" }
                ],
                
                filmes: [
                    { title: "Minecraft: O Filme", desc: "Lançamento Exclusivo 2025.", icon: "fa-cube", link: "https://mega.nz/file/ZC0miZhB#hKWd_DPh8vK7Z66bB2JAQ086l9mMTB6MKpZK6DMnjxQ", tag: "Novo" },
                    { title: "Festa da Salsicha", desc: "Animação adulta (Sem Cortes).", icon: "fa-hotdog", link: "https://mega.nz/file/pK9DGBJT#uZ80v9VNm2HbuBx5wAcLAsxidpmohhhpLSWP03FJ3Xk", tag: "+18" },
                    { title: "Invocação do Mal 2", desc: "Terror sobrenatural dublado.", icon: "fa-ghost", link: "https://mega.nz/file/dekTUS5A#e7sQVESZZMlvLTW9hM4eHgrdiyxmNMOovOziftNS3qg", tag: "Terror" },
                    { title: "Carros", desc: "Clássico Disney Pixar.", icon: "fa-car-side", link: "https://mega.nz/file/xSdj1DAL#UCeHnwu_kuBB9J2VszBmwEAHo-ce5vbKomEg_XoYe5M", tag: "Família" },
                    { title: "Velozes e Furiosos", desc: "Ação pura.", icon: "fa-tachometer-alt", link: "https://mega.nz/file/ZP9nVKZT#KeXWI03amTMoxzvaJppP0THnoVupRWNUsdO7kqFpjh8", tag: "Ação" },
                    { title: "Terrifier: Origem", desc: "Terror Gore Extremo.", icon: "fa-mask", link: "https://www.mediafire.com/file/76d9prd9jm4vsg8/Terrifier+O+Início-NUNU+AKAME.mp4/file", tag: "Gore" }
                ],

                apps: [
                    { title: "Campo Minado", desc: "Clássico jogo de lógica.", icon: "fa-bomb", link: "/Nunu/campominado.html", tag: "jogo" },
                    { title: "Clima", desc: "Verifique o tempo na sua região.", icon: "fa-cloud-moon-rain", link: "/Nunu/clima.html", tag: "Util" },
                    { title: "calendario", desc: "ver os dias", icon: "fa-calendar-alt", link: "/Nunu/Calendarionunu.html", tag: "Util" },
                    { title: "DAMA", desc: "jogo de dama", icon: "fa-chess-queen", link: "/Nunu/damamonaco.html", tag: "jogo" },
                    { title: "Corinthians", desc: "Notícias e jogos do Timão.", icon: "fa-trophy", link: "/Nunu/corinthians.html", tag: "Info" },
                    { title: "Brat Generator", desc: "Crie stickers com a fonte Brat.", icon: "fa-wand-magic", link: "/Nunu/brat.html", tag: "Edição" }
                ],

                scripts: [
                    { 
                        title: "Bot WhatsApp MD", 
                        desc: "Script base atualizado para automação.", 
                        icon: "fa-robot", 
                        link: "https://mega.nz/file/ML1XjaLa#W8y9giefK2A7RRXcXMfJVSjufJPJuTIlPDKpo9MhpEM", 
                        tag: "Download" 
                    }
                ]
            }
        };

        
        class MonacoSystem {
            constructor() {
                this.navContainer = document.getElementById('nav-container');
                this.appContainer = document.getElementById('app-container');
                this.currentPage = 'dashboard';
                
                this.init();
            }

            init() {
                this.renderNavigation();
                this.renderPage('dashboard');
                this.startClock();
            }

            renderNavigation() {
                let html = '';
                html += `<div class="menu-label">Navegação</div>`;
                
                SISTEMA_CONFIG.menus.forEach(menu => {
                    html += `
                        <div class="nav-item ${menu.id === 'dashboard' ? 'active' : ''}" 
                             onclick="System.renderPage('${menu.id}', this)">
                            <i class="fas ${menu.icon}"></i>
                            <span>${menu.label}</span>
                        </div>
                    `;
                });

                
                html += `<div style="margin-top: 2rem; border-top: 1px solid rgba(255,255,255,0.05); padding-top: 1rem"></div>`;
                html += `<div class="nav-item" style="color: #ef4444;" onclick="alert('Sistema finalizado.')">
                            <i class="fas fa-power-off"></i> <span>Desligar</span>
                         </div>`;

                this.navContainer.innerHTML = html;
            }

            renderPage(pageId, element = null) {
                if (element) {
                    document.querySelectorAll('.nav-item').forEach(el => el.classList.remove('active'));
                    element.classList.add('active');
                    
                    if (window.innerWidth < 768) toggleMenu();
                }
                this.appContainer.style.opacity = '0';
                this.appContainer.style.transform = 'translateY(10px)';
                
                setTimeout(() => {
                    const cardsData = SISTEMA_CONFIG.conteudo[pageId] || [];
                    const pageTitle = SISTEMA_CONFIG.menus.find(m => m.id === pageId)?.label || 'Dashboard';
                    document.getElementById('greeting').innerText = pageTitle;

                    let html = '';
                    
                    if (cardsData.length === 0) {
                        html = `<div style="text-align:center; padding: 2rem; color: var(--text-muted)">Sem itens nesta seção.</div>`;
                    } else {
                        cardsData.forEach(item => {

                            const extraClass = item.specialClass || '';
                            
                            html += `
                                <div class="card ${extraClass}" onclick="window.location.href='${item.link}'">
                                    ${window.innerWidth < 768 ? 
                                        
                                        `<div style="display:flex; align-items:center; width:100%">
                                            <div class="card-icon"><i class="fas ${item.icon}"></i></div>
                                            <div class="card-content-wrapper">
                                                <h3>${item.title}</h3>
                                                <span class="tag">${item.tag}</span>
                                            </div>
                                            <i class="fas fa-chevron-right" style="color:var(--text-muted)"></i>
                                        </div>` 
                                        : 
                                        
                                        `<div class="card-icon"><i class="fas ${item.icon}"></i></div>
                                         <h3>${item.title}</h3>
                                         <p>${item.desc}</p>
                                         <div class="card-footer">
                                             <span class="tag">${item.tag}</span>
                                             <div class="action-arrow"><i class="fas fa-arrow-right"></i></div>
                                         </div>`
                                    }
                                </div>
                            `;
                        });
                    }

                    this.appContainer.innerHTML = html;
                    
                    
                    this.appContainer.style.opacity = '1';
                    this.appContainer.style.transform = 'translateY(0)';
                }, 200);
            }

            startClock() {
                const dateEl = document.getElementById('date-display');
                const update = () => {
                    const now = new Date();
                    const options = { weekday: 'long', day: 'numeric', month: 'long' };
                    dateEl.innerText = now.toLocaleDateString('pt-BR', options);
                };
                update();
                setInterval(update, 60000);
            }
        }

        
        function toggleMenu() {
            document.getElementById('sidebar').classList.toggle('active');
            document.getElementById('overlay').classList.toggle('active');
        }


        const System = new MonacoSystem();
        

        let resizeTimer;
        window.addEventListener('resize', () => {
            clearTimeout(resizeTimer);
            resizeTimer = setTimeout(() => {
                const current = document.querySelector('.nav-item.active');
                if(current) System.renderPage(current.getAttribute('onclick').match(/'([^']+)'/)[1]);
            }, 200);
        });

    </script>
</body>
</html>
