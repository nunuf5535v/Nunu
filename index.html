<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
<title>Jogo da Velha Moderno</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Montserrat:wght@600&display=swap');
  body {
    margin: 0;
    background: linear-gradient(135deg, #667eea, #764ba2);
    font-family: 'Montserrat', sans-serif;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: flex-start;
    height: 100vh;
    color: #fff;
    padding: 20px;
    user-select: none;
  }
  h1 {
    margin: 20px 0 10px;
    font-weight: 600;
    letter-spacing: 2px;
  }
  .board {
    display: grid;
    grid-template-columns: repeat(3, 90px);
    grid-template-rows: repeat(3, 90px);
    gap: 15px;
    margin-top: 20px;
  }
  .cell {
    background: rgba(255, 255, 255, 0.15);
    border-radius: 15px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 3.5rem;
    color: #fff;
    cursor: pointer;
    transition: background 0.3s ease, transform 0.2s ease;
  }
  .cell:hover {
    background: rgba(255, 255, 255, 0.3);
    transform: scale(1.05);
  }
  .cell.taken {
    cursor: default;
    background: rgba(255, 255, 255, 0.35);
  }
  .info {
    margin-top: 30px;
    font-size: 1.3rem;
    font-weight: 600;
    letter-spacing: 1.2px;
    min-height: 1.5em;
    text-align: center;
  }
  button.reset-btn {
    margin-top: 30px;
    background: #fff;
    color: #764ba2;
    border: none;
    border-radius: 25px;
    padding: 12px 30px;
    font-weight: 700;
    font-size: 1rem;
    cursor: pointer;
    box-shadow: 0 4px 15px rgba(0,0,0,0.2);
    transition: background-color 0.3s ease;
  }
  button.reset-btn:hover {
    background: #f0e9ff;
  }
  @media (max-width: 400px) {
    .board {
      grid-template-columns: repeat(3, 70px);
      grid-template-rows: repeat(3, 70px);
      gap: 12px;
    }
    .cell {
      font-size: 2.8rem;
    }
  }
</style>
</head>
<body>
  <h1>Jogo da Velha</h1>
  <div class="board" id="board">
    <div class="cell" data-index="0"></div>
    <div class="cell" data-index="1"></div>
    <div class="cell" data-index="2"></div>
    <div class="cell" data-index="3"></div>
    <div class="cell" data-index="4"></div>
    <div class="cell" data-index="5"></div>
    <div class="cell" data-index="6"></div>
    <div class="cell" data-index="7"></div>
    <div class="cell" data-index="8"></div>
  </div>
  <div class="info" id="info">Vez do: X</div>
  <button class="reset-btn" id="resetBtn">Reiniciar</button>

  <script>
    const board = document.getElementById('board');
    const info = document.getElementById('info');
    const resetBtn = document.getElementById('resetBtn');
    let boardState = Array(9).fill('');
    let currentPlayer = 'X';
    let running = true;

    function checkWin() {
      const winPatterns = [
        [0,1,2], [3,4,5], [6,7,8],
        [0,3,6], [1,4,7], [2,5,8],
        [0,4,8], [2,4,6]
      ];
      for (const pattern of winPatterns) {
        const [a,b,c] = pattern;
        if (
          boardState[a] &&
          boardState[a] === boardState[b] &&
          boardState[a] === boardState[c]
        ) return boardState[a];
      }
      if (!boardState.includes('')) return 'Empate';
      return null;
    }

    function updateBoard() {
      board.childNodes.forEach((cell, idx) => {
        cell.textContent = boardState[idx];
        cell.classList.toggle('taken', boardState[idx] !== '');
      });
    }

    function handleClick(e) {
      const idx = e.target.dataset.index;
      if (!running || boardState[idx] !== '') return;
      boardState[idx] = currentPlayer;
      updateBoard();
      const winner = checkWin();
      if (winner) {
        running = false;
        info.textContent = winner === 'Empate' ? 'Empate! 🤝' : `Jogador ${winner} venceu! 🎉`;
      } else {
        currentPlayer = currentPlayer === 'X' ? 'O' : 'X';
        info.textContent = `Vez do: ${currentPlayer}`;
      }
    }

    function resetGame() {
      boardState.fill('');
      currentPlayer = 'X';
      running = true;
      info.textContent = `Vez do: ${currentPlayer}`;
      updateBoard();
    }

    board.addEventListener('click', handleClick);
    resetBtn.addEventListener('click', resetGame);
    updateBoard();
  </script>
</body>
      </html>
