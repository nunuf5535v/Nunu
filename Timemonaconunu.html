<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MONACO TEMPOS</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        :root {
            --glass-bg: rgba(255, 255, 255, 0.1);
            --glass-border: rgba(255, 255, 255, 0.2);
            --primary: #00d2ff;
            --secondary: #3a7bd5;
            --text-main: #ffffff;
            --text-muted: #e0e0e0;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Poppins', sans-serif;
        }

        body {
            background: linear-gradient(-45deg, #ee7752, #e73c7e, #23a6d5, #23d5ab);
            background-size: 400% 400%;
            animation: gradientBG 15s ease infinite;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden; /* Evita scroll na animação de fundo */
        }

        /* Animação do Background */
        @keyframes gradientBG {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        /* --- Container Principal (Glassmorphism) --- */
        #app-container {
            background: var(--glass-bg);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid var(--glass-border);
            border-radius: 24px;
            box-shadow: 0 8px 32px 0 rgba(31, 38, 135, 0.37);
            padding: 2rem;
            position: relative;
            transition: all 0.5s cubic-bezier(0.25, 0.8, 0.25, 1);
            overflow-y: auto;
            
            /* Estado Inicial: Mobile */
            width: 380px;
            height: 80vh; 
            max-height: 850px;
        }

        /* Estados de Visualização (Controlados pelo Menu) */
        #app-container.view-mobile {
            width: 380px;
            height: 80vh;
        }

        #app-container.view-pc {
            width: 90%;
            max-width: 1000px;
            height: auto;
            min-height: 60vh;
        }

        /* --- Menu de 3 Pontinhos --- */
        .menu-container {
            position: absolute;
            top: 20px;
            right: 20px;
            z-index: 10;
        }

        .menu-btn {
            background: transparent;
            border: none;
            color: white;
            font-size: 1.5rem;
            cursor: pointer;
            transition: transform 0.3s;
        }

        .menu-btn:hover { transform: rotate(90deg); }

        .dropdown {
            position: absolute;
            top: 30px;
            right: 0;
            background: rgba(0, 0, 0, 0.8);
            border-radius: 12px;
            width: 150px;
            display: none; /* Escondido por padrão */
            flex-direction: column;
            overflow: hidden;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
        }

        .dropdown.active { display: flex; animation: fadeIn 0.3s ease; }

        .dropdown button {
            background: transparent;
            border: none;
            color: white;
            padding: 12px;
            text-align: left;
            cursor: pointer;
            font-size: 0.9rem;
            transition: background 0.2s;
        }

        .dropdown button:hover { background: rgba(255,255,255,0.1); }
        .dropdown button i { margin-right: 8px; width: 20px; }

        /* --- Conteúdo --- */
        header { text-align: center; margin-bottom: 2rem; }
        h1 { color: var(--text-main); font-weight: 700; font-size: 1.8rem; margin-bottom: 0.5rem; }
        p.subtitle { color: var(--text-muted); font-size: 0.9rem; }

        .input-group {
            margin-bottom: 2rem;
            position: relative;
        }

        label { display: block; color: var(--text-muted); margin-bottom: 8px; font-size: 0.9rem; }
        
        input[type="date"] {
            width: 100%;
            padding: 15px;
            border-radius: 12px;
            border: 1px solid rgba(255,255,255,0.3);
            background: rgba(255,255,255,0.1);
            color: white;
            font-size: 1rem;
            outline: none;
            transition: 0.3s;
            color-scheme: dark; /* Ícone do calendário branco */
        }

        input[type="date"]:focus {
            background: rgba(255,255,255,0.2);
            border-color: var(--primary);
            box-shadow: 0 0 15px rgba(0, 210, 255, 0.3);
        }

        /* --- Cards de Resultado --- */
        .results-area {
            display: flex;
            flex-direction: column;
            gap: 1rem;
        }

        /* Grid no modo PC */
        .view-pc .results-area {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
        }

        .card {
            background: rgba(0, 0, 0, 0.3);
            padding: 1.5rem;
            border-radius: 16px;
            text-align: center;
            transform: translateY(20px);
            opacity: 0;
            animation: slideUp 0.5s forwards;
            border: 1px solid rgba(255,255,255,0.05);
        }

        .card:nth-child(2) { animation-delay: 0.1s; }
        .card:nth-child(3) { animation-delay: 0.2s; }

        .card-icon {
            font-size: 2rem;
            margin-bottom: 10px;
            background: -webkit-linear-gradient(var(--primary), var(--secondary));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .card h3 { font-size: 2.5rem; font-weight: 700; margin: 5px 0; }
        .card span { font-size: 0.9rem; color: var(--text-muted); text-transform: uppercase; letter-spacing: 1px; }
        
        .detail-text {
            font-size: 0.85rem;
            color: #aaa;
            margin-top: 5px;
        }

        /* Status Badge */
        .status-badge {
            display: inline-block;
            padding: 6px 12px;
            border-radius: 20px;
            font-size: 0.8rem;
            font-weight: bold;
            margin-top: 1rem;
            background: rgba(255,255,255,0.1);
        }
        .status-future { background: rgba(46, 204, 113, 0.2); color: #2ecc71; }
        .status-past { background: rgba(231, 76, 60, 0.2); color: #e74c3c; }
        .status-today { background: rgba(241, 196, 15, 0.2); color: #f1c40f; }

        @keyframes slideUp {
            to { opacity: 1; transform: translateY(0); }
        }
        
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(-10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* Efeito de Partículas (Bolinhas flutuantes) */
        .circles {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%; overflow: hidden; z-index: -1;
        }
        .circles li {
            position: absolute; display: block; list-style: none;
            width: 20px; height: 20px; background: rgba(255, 255, 255, 0.2);
            animation: animate 25s linear infinite; bottom: -150px; border-radius: 50%;
        }
        .circles li:nth-child(1){ left: 25%; width: 80px; height: 80px; animation-delay: 0s; }
        .circles li:nth-child(2){ left: 10%; width: 20px; height: 20px; animation-delay: 2s; animation-duration: 12s; }
        .circles li:nth-child(3){ left: 70%; width: 20px; height: 20px; animation-delay: 4s; }
        .circles li:nth-child(4){ left: 40%; width: 60px; height: 60px; animation-delay: 0s; animation-duration: 18s; }
        @keyframes animate {
            0%{ transform: translateY(0) rotate(0deg); opacity: 1; border-radius: 0; }
            100%{ transform: translateY(-1000px) rotate(720deg); opacity: 0; border-radius: 50%; }
        }

    </style>
</head>
<body>

    <ul class="circles">
        <li></li><li></li><li></li><li></li><li></li>
        <li></li><li></li><li></li><li></li><li></li>
    </ul>

    <div id="app-container" class="view-mobile">
        
        <div class="menu-container">
            <button class="menu-btn" onclick="toggleMenu()">
                <i class="fas fa-ellipsis-v"></i>
            </button>
            <div class="dropdown" id="dropdown-menu">
                <button onclick="setView('mobile')"><i class="fas fa-mobile-alt"></i> Modo Celular</button>
                <button onclick="setView('pc')"><i class="fas fa-desktop"></i> Modo PC</button>
            </div>
        </div>

        <header>
            <i class="fas fa-hourglass-half" style="font-size: 3rem; color: var(--primary); margin-bottom: 10px;"></i>
            <h1>MONACO TIME</h1>
            <p class="subtitle">Descubra quanto tempo falta ou já passou.</p>
        </header>

        <div class="input-group">
            <label for="targetDate">Escolha uma data:</label>
            <input type="date" id="targetDate" onchange="calculateTime()">
        </div>

        <div id="results" class="results-area" style="display: none;">
            
            <div class="card">
                <div class="card-icon"><i class="far fa-calendar-alt"></i></div>
                <h3 id="total-days">0</h3>
                <span>Dias de diferença</span>
                <div id="status-badge" class="status-badge"></div>
            </div>

            <div class="card">
                <div class="card-icon"><i class="fas fa-calendar-week"></i></div>
                <h3 id="total-weeks">0</h3>
                <span>Semanas</span>
            </div>

            <div class="card">
                <div class="card-icon"><i class="fas fa-layer-group"></i></div>
                <h3 id="detailed-years">0</h3>
                <span>Anos Completos</span>
                <div class="detail-text" id="detailed-breakdown">0 meses e 0 dias</div>
            </div>

        </div>
    </div>

    <script>
        function toggleMenu() {
            const menu = document.getElementById('dropdown-menu');
            menu.classList.toggle('active');
        }

        window.onclick = function(event) {
            if (!event.target.matches('.menu-btn') && !event.target.matches('.menu-btn i')) {
                const dropdowns = document.getElementsByClassName("dropdown");
                for (let i = 0; i < dropdowns.length; i++) {
                    const openDropdown = dropdowns[i];
                    if (openDropdown.classList.contains('active')) {
                        openDropdown.classList.remove('active');
                    }
                }
            }
        }

        function setView(mode) {
            const container = document.getElementById('app-container');
            if (mode === 'mobile') {
                container.classList.remove('view-pc');
                container.classList.add('view-mobile');
            } else {
                container.classList.remove('view-mobile');
                container.classList.add('view-pc');
            }
        }

        function calculateTime() {
            const inputDate = document.getElementById('targetDate').value;
            if (!inputDate) return;

            const target = new Date(inputDate);
            
            target.setHours(0, 0, 0, 0); 
            
            const now = new Date();
            now.setHours(0, 0, 0, 0);

            const diffTime = target - now;
            const diffDays = Math.ceil(diffTime / (1000 * 60 * 60 * 24)); 

            
            document.getElementById('results').style.display = document.getElementById('app-container').classList.contains('view-pc') ? 'grid' : 'flex';

            
            const absDays = Math.abs(diffDays);
            animateValue("total-days", 0, absDays, 1000);


            const weeks = (absDays / 7).toFixed(1);
            animateValue("total-weeks", 0, weeks, 1000);

            const badge = document.getElementById('status-badge');
            if (diffDays > 0) {
                badge.className = "status-badge status-future";
                badge.innerText = "Faltam para chegar";
            } else if (diffDays < 0) {
                badge.className = "status-badge status-past";
                badge.innerText = "Já se passaram";
            } else {
                badge.className = "status-badge status-today";
                badge.innerText = "É hoje!";
            }


            calculateDetailedBreakdown(now, target);
        }

        function calculateDetailedBreakdown(d1, d2) {

            let start = d1 < d2 ? new Date(d1) : new Date(d2);
            let end = d1 < d2 ? new Date(d2) : new Date(d1);

            let years = end.getFullYear() - start.getFullYear();
            let months = end.getMonth() - start.getMonth();
            let days = end.getDate() - start.getDate();

            if (days < 0) {
                months--;
                
                const prevMonth = new Date(end.getFullYear(), end.getMonth(), 0);
                days += prevMonth.getDate();
            }

            if (months < 0) {
                years--;
                months += 12;
            }

            document.getElementById('detailed-years').innerText = years;
            document.getElementById('detailed-breakdown').innerText = `+ ${months} meses e ${days} dias`;
        }

        
        function animateValue(id, start, end, duration) {
            if (isNaN(end)) end = 0;
            const obj = document.getElementById(id);
            let startTimestamp = null;
            const step = (timestamp) => {
                if (!startTimestamp) startTimestamp = timestamp;
                const progress = Math.min((timestamp - startTimestamp) / duration, 1);
                
                
                const val = progress * (end - start) + start;
                obj.innerHTML = Number.isInteger(parseFloat(end)) ? Math.floor(val) : val.toFixed(1);
                
                if (progress < 1) {
                    window.requestAnimationFrame(step);
                } else {
                     obj.innerHTML = end; 
                }
            };
            window.requestAnimationFrame(step);
        }

        
        const container = document.getElementById('app-container');
        const observer = new MutationObserver(function(mutations) {
            const results = document.getElementById('results');
            if(results.style.display !== 'none'){
                results.style.display = container.classList.contains('view-pc') ? 'grid' : 'flex';
            }
        });
        observer.observe(container, { attributes: true, attributeFilter: ['class'] });

    </script>
</body>
</html>
