<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<title>DANOCO</title>
<style>
    :root {
        --primary: #00d2d3;
        --secondary: #5f27cd;
        --dark: #222f3e;
        --darker: #000000;
        --light: #c8d6e5;
        --board-light: #feca57;
        --board-dark: #ff9f43;
        --glass: rgba(255, 255, 255, 0.08);
        --glass-border: rgba(255, 255, 255, 0.1);
        --shadow: 0 10px 20px rgba(0,0,0,0.5);
        --safe-area-top: env(safe-area-inset-top);
        --safe-area-bottom: env(safe-area-inset-bottom);
    }

    * {
        box-sizing: border-box;
        -webkit-tap-highlight-color: transparent;
        user-select: none;
        touch-action: none;
        font-family: 'Segoe UI', Roboto, sans-serif;
    }

    body {
        background: radial-gradient(circle at center, #1e272e, #000);
        margin: 0;
        height: 100vh;
        overflow: hidden;
        display: flex;
        flex-direction: column;
        color: white;
    }

    .screen {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        background: var(--darker);
        opacity: 0;
        pointer-events: none;
        transition: opacity 0.4s ease;
        z-index: 10;
    }

    .screen.active {
        opacity: 1;
        pointer-events: all;
        z-index: 20;
    }

    .logo {
        font-size: 3rem;
        font-weight: 900;
        background: linear-gradient(45deg, var(--primary), var(--secondary));
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        margin-bottom: 2rem;
        text-transform: uppercase;
        letter-spacing: 2px;
        filter: drop-shadow(0 0 15px rgba(0, 210, 211, 0.3));
        animation: float 3s ease-in-out infinite;
    }

    .btn {
        background: var(--glass);
        border: 1px solid var(--glass-border);
        color: white;
        padding: 1.2rem 3rem;
        border-radius: 50px;
        font-size: 1.1rem;
        font-weight: bold;
        margin: 0.5rem;
        width: 80%;
        max-width: 300px;
        cursor: pointer;
        transition: all 0.2s;
        text-transform: uppercase;
        letter-spacing: 1px;
        box-shadow: var(--shadow);
    }

    .btn:active {
        transform: scale(0.95);
        background: rgba(255,255,255,0.15);
    }

    .btn.primary {
        background: linear-gradient(90deg, var(--secondary), var(--primary));
        border: none;
    }

    #game-ui {
        background: transparent;
        justify-content: flex-start;
        padding-top: calc(10px + var(--safe-area-top));
    }

    .hud {
        width: 95%;
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 10px;
        background: var(--glass);
        border-radius: 20px;
        backdrop-filter: blur(10px);
        margin-bottom: 20px;
        border: 1px solid var(--glass-border);
    }

    .player-card {
        display: flex;
        align-items: center;
        gap: 10px;
    }

    .avatar {
        width: 40px;
        height: 40px;
        border-radius: 50%;
        background: #ddd;
        border: 2px solid white;
        display: grid;
        place-items: center;
        font-size: 1.2rem;
    }

    .score-badge {
        font-weight: bold;
        font-size: 1.2rem;
    }

    .board-container {
        width: 96vmin;
        height: 96vmin;
        background: #2d3436;
        padding: 2vmin;
        border-radius: 10px;
        box-shadow: 0 20px 50px rgba(0,0,0,0.6);
        position: relative;
    }

    #board {
        width: 100%;
        height: 100%;
        display: grid;
        grid-template-columns: repeat(8, 1fr);
        grid-template-rows: repeat(8, 1fr);
        border-radius: 4px;
        overflow: hidden;
    }

    .sq {
        width: 100%;
        height: 100%;
        display: grid;
        place-items: center;
        position: relative;
    }

    .sq.dark { background: var(--board-dark); }
    .sq.light { background: var(--board-light); }

    .sq.valid::after {
        content: '';
        width: 25%;
        height: 25%;
        background: rgba(0, 255, 0, 0.6);
        border-radius: 50%;
        box-shadow: 0 0 10px #00ff00;
        animation: pulse 1s infinite;
    }

    .sq.capture-hint {
        box-shadow: inset 0 0 15px rgba(255, 0, 0, 0.8);
    }

    .piece {
        width: 80%;
        height: 80%;
        border-radius: 50%;
        position: relative;
        transition: transform 0.25s cubic-bezier(0.34, 1.56, 0.64, 1);
        z-index: 5;
        box-shadow: 0 4px 6px rgba(0,0,0,0.4);
    }

    .piece.white {
        background: radial-gradient(circle at 30% 30%, #fff, #dfe6e9);
        border: 2px solid #fff;
    }

    .piece.black {
        background: radial-gradient(circle at 30% 30%, #636e72, #2d3436);
        border: 2px solid #2d3436;
    }

    .piece.king::before {
        content: '♕';
        position: absolute;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -55%);
        font-size: 2.5rem;
        color: gold;
        text-shadow: 0 2px 2px rgba(0,0,0,0.5);
    }

    .piece.selected {
        transform: scale(1.2) translateY(-5px);
        box-shadow: 0 15px 25px rgba(0,0,0,0.6);
        z-index: 100;
        border-color: var(--primary);
    }

    .controls-bar {
        position: absolute;
        bottom: calc(20px + var(--safe-area-bottom));
        width: 100%;
        display: flex;
        justify-content: center;
        gap: 20px;
    }

    .mini-btn {
        width: 50px;
        height: 50px;
        border-radius: 50%;
        border: none;
        background: var(--glass);
        color: white;
        font-size: 1.2rem;
        display: grid;
        place-items: center;
        backdrop-filter: blur(5px);
    }

    .modal-overlay {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background: rgba(0,0,0,0.9);
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        z-index: 50;
        opacity: 0;
        pointer-events: none;
        transition: 0.3s;
    }

    .modal-overlay.active {
        opacity: 1;
        pointer-events: all;
    }

    .result-title {
        font-size: 4rem;
        font-weight: 900;
        margin-bottom: 1rem;
        text-transform: uppercase;
    }

    .win { color: var(--primary); }
    .lose { color: #ff4757; }

    .xp-bar-container {
        width: 80%;
        height: 10px;
        background: #333;
        border-radius: 10px;
        margin: 20px 0;
        overflow: hidden;
    }

    .xp-bar-fill {
        height: 100%;
        background: linear-gradient(90deg, var(--secondary), var(--primary));
        width: 0%;
        transition: width 1s ease;
    }

    @keyframes pulse {
        0% { transform: scale(0.8); opacity: 0.5; }
        100% { transform: scale(1.2); opacity: 0; }
    }

    @keyframes float {
        0%, 100% { transform: translateY(0); }
        50% { transform: translateY(-10px); }
    }

    .toast {
        position: fixed;
        top: 20%;
        left: 50%;
        transform: translate(-50%, -50%) scale(0.8);
        background: rgba(0,0,0,0.8);
        padding: 15px 30px;
        border-radius: 30px;
        opacity: 0;
        pointer-events: none;
        transition: 0.3s;
        z-index: 100;
        text-align: center;
        border: 1px solid var(--primary);
    }

    .toast.show {
        opacity: 1;
        transform: translate(-50%, -50%) scale(1);
    }
</style>

<script>
const AudioEng = {
    ctx: null,
    bgmOscs: [],
    muted: false,
    init() {
        if (!this.ctx) {
            this.ctx = new (window.AudioContext || window.webkitAudioContext)()
            this.playAmbience()
        }
    },
    playTone(freq, type, dur, vol=0.1) {
        if(this.muted || !this.ctx) return
        const o = this.ctx.createOscillator()
        const g = this.ctx.createGain()
        o.type = type
        o.frequency.setValueAtTime(freq, this.ctx.currentTime)
        g.gain.setValueAtTime(vol, this.ctx.currentTime)
        g.gain.exponentialRampToValueAtTime(0.001, this.ctx.currentTime + dur)
        o.connect(g)
        g.connect(this.ctx.destination)
        o.start()
        o.stop(this.ctx.currentTime + dur)
    },
    sfx(type) {
        if(this.ctx && this.ctx.state === 'suspended') this.ctx.resume()
        switch(type) {
            case 'move': this.playTone(300, 'sine', 0.1, 0.1); break
            case 'capture': this.playTone(150, 'square', 0.15, 0.2); if(navigator.vibrate) navigator.vibrate(50); break
            case 'king': this.playTone(600, 'triangle', 0.3, 0.2); this.playTone(800, 'triangle', 0.3, 0.2); break
            case 'win': [400,500,600,800].forEach((f,i)=>setTimeout(()=>this.playTone(f,'triangle',0.2,0.2), i*100)); break
            case 'lose': [300,250,200,100].forEach((f,i)=>setTimeout(()=>this.playTone(f,'sawtooth',0.3,0.2), i*150)); break
            case 'error': this.playTone(100, 'sawtooth', 0.2, 0.2); if(navigator.vibrate) navigator.vibrate([30,30]); break
        }
    },
    playAmbience() {
        
        if(this.muted) return
        const o = this.ctx.createOscillator()
        const g = this.ctx.createGain()
        o.frequency.value = 50
        g.gain.value = 0.02
        o.connect(g)
        g.connect(this.ctx.destination)
        o.start()
        this.bgmOscs.push(o)
    },
    stopAll() {
        this.bgmOscs.forEach(o => o.stop())
        this.bgmOscs = []
    }
}
</script>

<script>
/**
 * 🛠️ CORE STATE MACHINE
 */
const State = {
    MENU: 0, GAME: 1, PAUSE: 2, RESULT: 3,
    current: 0
}

const Store = {
    data: { xp: 0, level: 1, wins: 0 },
    load() {
        const s = localStorage.getItem('dama_legends_save')
        if(s) this.data = JSON.parse(s)
        this.updateUI()
    },
    save() {
        localStorage.setItem('dama_legends_save', JSON.stringify(this.data))
        this.updateUI()
    },
    addXP(amount) {
        this.data.xp += amount
       
        const req = this.data.level * 100
        if(this.data.xp >= req) {
            this.data.xp -= req
            this.data.level++
            App.toast(`SUBIU PARA O NÍVEL ${this.data.level}!`)
        }
        this.save()
    },
    updateUI() {
        document.getElementById('menu-lvl').innerText = this.data.level
        const pct = (this.data.xp / (this.data.level * 100)) * 100
        document.getElementById('menu-xp').style.width = `${pct}%`
    }
}

/**
 * ♟️ GAME ENGINE
 */
const C = { EMPTY: 0, WHITE: 1, BLACK: 2, W_KING: 3, B_KING: 4 }

class DamaGame {
    constructor() {
        this.board = []
        this.turn = C.WHITE
        this.whitePieces = 12
        this.blackPieces = 12
        this.history = [] 
        this.mustCapture = false
        this.chainPiece = null
        this.gameOver = false
    }

    init() {
        this.board = Array(8).fill(0).map(()=>Array(8).fill(C.EMPTY))
        for(let r=0; r<8; r++){
            for(let c=0; c<8; c++){
                if((r+c)%2!==0) {
                    if(r<3) this.board[r][c] = C.BLACK
                    if(r>4) this.board[r][c] = C.WHITE
                }
            }
        }
        this.turn = C.WHITE
        this.whitePieces = 12
        this.blackPieces = 12
        this.history = []
        this.mustCapture = false
        this.chainPiece = null
        this.gameOver = false
    }

    clone() {
        const g = new DamaGame()
        g.board = this.board.map(r => [...r])
        g.turn = this.turn
        g.whitePieces = this.whitePieces
        g.blackPieces = this.blackPieces
        g.mustCapture = this.mustCapture
        g.chainPiece = this.chainPiece
        g.gameOver = this.gameOver
        return g
    }

    isPlayer(p, pl) {
        if(pl === C.WHITE) return p===C.WHITE || p===C.W_KING
        return p===C.BLACK || p===C.B_KING
    }

    
    getMoves(player) {
        let moves = []
        let hasCapture = false


        if(this.chainPiece) {
            const m = this.getPieceMoves(this.chainPiece.r, this.chainPiece.c)
            return m.filter(x => x.capture)
        }

        for(let r=0; r<8; r++){
            for(let c=0; c<8; c++){
                if(this.isPlayer(this.board[r][c], player)) {
                    let m = this.getPieceMoves(r, c)
                    if(m.some(x=>x.capture)) hasCapture = true
                    moves.push(...m)
                }
            }
        }

        if(hasCapture) return moves.filter(x=>x.capture)
        return moves
    }

    getPieceMoves(r, c) {
        let moves = []
        const p = this.board[r][c]
        const isK = p===C.W_KING || p===C.B_KING
        const isW = p===C.WHITE || p===C.W_KING
        
        
        const fw = isW ? -1 : 1
        

        let mDirs = isK ? [[-1,-1],[-1,1],[1,-1],[1,1]] : [[fw,-1], [fw,1]]
        

        let cDirs = isK ? [[-1,-1],[-1,1],[1,-1],[1,1]] : [[fw,-1], [fw,1]]

        for(let d of cDirs) {
            if(isK) { 
                let nr=r+d[0], nc=c+d[1]
                while(this.isValid(nr,nc) && this.board[nr][nc]===C.EMPTY) { nr+=d[0]; nc+=d[1] }
                if(this.isValid(nr,nc)) {
                    let target = this.board[nr][nc]
                    if(target!==C.EMPTY && !this.isPlayer(target, isW?C.WHITE:C.BLACK)) {
                        let rr=nr+d[0], cc=nc+d[1]
                        while(this.isValid(rr,cc)) {
                            if(this.board[rr][cc]!==C.EMPTY) break
                            moves.push({from:{r,c}, to:{r:rr,c:cc}, capture:true, victim:{r:nr,c:nc}})
                            rr+=d[0]; cc+=d[1]
                        }
                    }
                }
            } else { 
                let nr=r+d[0], nc=c+d[1] 
                let lr=r+d[0]*2, lc=c+d[1]*2
                if(this.isValid(lr,lc) && this.board[lr][lc]===C.EMPTY) {
                    let target = this.board[nr][nc]
                    if(target!==C.EMPTY && !this.isPlayer(target, isW?C.WHITE:C.BLACK)) {
                        moves.push({from:{r,c}, to:{r:lr,c:lc}, capture:true, victim:{r:nr,c:nc}})
                    }
                }
            }
        }

        
        if(!this.chainPiece) {
            for(let d of mDirs) {
                if(isK) {
                    let nr=r+d[0], nc=c+d[1]
                    while(this.isValid(nr,nc) && this.board[nr][nc]===C.EMPTY) {
                        moves.push({from:{r,c}, to:{r:nr,c:nc}, capture:false})
                        nr+=d[0]; nc+=d[1]
                    }
                } else { 
                    let nr=r+d[0], nc=c+d[1]
                    if(this.isValid(nr,nc) && this.board[nr][nc]===C.EMPTY) {
                        moves.push({from:{r,c}, to:{r:nr,c:nc}, capture:false})
                    }
                }
            }
        }
        return moves
    }

    isValid(r, c) { return r>=0 && c>=0 && r<8 && c<8 }

    doMove(move) {
        if(!this.chainPiece) {
            this.history.push(JSON.stringify({
                b: this.board, t: this.turn, w: this.whitePieces, b: this.blackPieces
            }))
            if(this.history.length > 5) this.history.shift()
        }

        const p = this.board[move.from.r][move.from.c]
        this.board[move.to.r][move.to.c] = p
        this.board[move.from.r][move.from.c] = C.EMPTY

        let captured = false
        if(move.capture) {
            this.board[move.victim.r][move.victim.c] = C.EMPTY
            if(this.turn === C.WHITE) this.blackPieces--
            else this.whitePieces--
            captured = true
        }

        
        let promoted = false
        if(p===C.WHITE && move.to.r===0) { this.board[move.to.r][move.to.c] = C.W_KING; promoted=true }
        if(p===C.BLACK && move.to.r===7) { this.board[move.to.r][move.to.c] = C.B_KING; promoted=true }

        
        let chain = false
        if(captured && !promoted) {
            let temp = this.chainPiece
            this.chainPiece = {r: move.to.r, c: move.to.c}
            const followUp = this.getMoves(this.turn)
            this.chainPiece = temp 
            if(followUp.length > 0) {
                this.chainPiece = {r: move.to.r, c: move.to.c}
                this.mustCapture = true
                chain = true
            }
        }

        if(!chain) {
            this.chainPiece = null
            this.mustCapture = false
            this.turn = this.turn === C.WHITE ? C.BLACK : C.WHITE
        }

        return { captured, promoted, chain }
    }

    undo() {
        if(this.history.length === 0) return false
        const prev = JSON.parse(this.history.pop())
        this.board = prev.b
        this.turn = prev.t
        this.whitePieces = prev.w
        this.blackPieces = prev.b
        this.chainPiece = null
        this.mustCapture = false
        return true
    }
}

/**
 * 🤖 AI BRAIN (ADAPTIVE)
 */
const AI = {
    worker: null,
    
    evaluate(game, diff) {
        let score = 0
        const isEndgame = (game.whitePieces + game.blackPieces) < 10

        let aggression = 1.0
        if(game.blackPieces < game.whitePieces) aggression = 1.5
        if(game.blackPieces > game.whitePieces) aggression = 0.8 
        for(let r=0; r<8; r++){
            for(let c=0; c<8; c++){
                const p = game.board[r][c]
                if(p===C.EMPTY) continue
                
                let val = 0
                const isK = p===C.W_KING || p===C.B_KING
                const isB = p===C.BLACK || p===C.B_KING
                
                
                val += isK ? 50 : 10
                
                if(!isK) {

                    if(c>1 && c<6 && r>1 && r<6) val += 2

                    if(c===0 || c===7) val += 3

                    val += (isB ? r : (7-r)) * 1.5
                } else {
                    if(isEndgame) val += 5
                }

                if(isB) score += val * aggression
                else score -= val
            }
        }
        return score + (Math.random() * 0.5) 
    },

    getBestMove(game, diff) {
        const moves = game.getMoves(C.BLACK)
        if(moves.length === 0) return null

        const depth = diff === 'easy' ? 1 : (diff === 'medium' ? 3 : 5)
        
        let bestScore = -Infinity
        let bestMove = moves[0]
        
        
        for(let m of moves) {
            let sim = game.clone()
            sim.doMove(m)
            let score = this.minimax(sim, depth-1, -Infinity, Infinity, false, diff)
            if(score > bestScore) {
                bestScore = score
                bestMove = m
            }
        }
        return bestMove
    },

    minimax(game, d, alpha, beta, max, diff) {
        if(d===0 || game.gameOver) return this.evaluate(game, diff)
        
        const player = max ? C.BLACK : C.WHITE
        const moves = game.getMoves(player)
        
        if(moves.length===0) return max ? -1000 : 1000

        if(max) {
            let v = -Infinity
            for(let m of moves) {
                let sim = game.clone()
                sim.doMove(m)
                v = Math.max(v, this.minimax(sim, d-1, alpha, beta, false, diff))
                alpha = Math.max(alpha, v)
                if(beta <= alpha) break
            }
            return v
        } else {
            let v = Infinity
            for(let m of moves) {
                let sim = game.clone()
                sim.doMove(m)
                v = Math.min(v, this.minimax(sim, d-1, alpha, beta, true, diff))
                beta = Math.min(beta, v)
                if(beta <= alpha) break
            }
            return v
        }
    }
}

/**
 * 📱 UI CONTROLLER & APP LOGIC
 */
const App = {
    game: new DamaGame(),
    uiBoard: document.getElementById('board'),
    selected: null,
    validMoves: [],
    difficulty: 'medium',
    lastDiff: 'medium',
    isAiThinking: false,

    init() {
        AudioEng.init()
        Store.load()
        this.renderMenu()
    },

    
    switchScreen(id) {
        document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'))
        document.querySelectorAll('.modal-overlay').forEach(m => m.classList.remove('active'))
        document.getElementById(id).classList.add('active')
    },

    startGame(diff) {
        this.difficulty = diff
        this.lastDiff = diff
        this.game.init()
        this.selected = null
        this.validMoves = []
        this.isAiThinking = false
        this.updateHUD()
        this.drawBoard()
        this.switchScreen('screen-game')
        AudioEng.sfx('move')
    },

    goToMenu() {
        this.game = new DamaGame() // Hard Reset
        this.selected = null
        this.isAiThinking = false
        this.switchScreen('screen-menu')
        Store.updateUI()
    },

    showPause() { document.getElementById('modal-pause').classList.add('active') },
    resumeGame() { document.getElementById('modal-pause').classList.remove('active') },

    drawBoard() {
        this.uiBoard.innerHTML = ''
        const moves = (this.game.turn === C.WHITE) ? this.game.getMoves(C.WHITE) : []

        if(moves.length === 0 && this.game.turn === C.WHITE && !this.game.gameOver) {
            this.endGame(false)
            return
        }

        for(let r=0; r<8; r++){
            for(let c=0; c<8; c++){
                const sq = document.createElement('div')
                sq.className = `sq ${(r+c)%2!==0 ? 'dark' : 'light'}`
                
                
                if(this.game.turn === C.WHITE) sq.onclick = () => this.onClick(r,c)

                const move = this.validMoves.find(m => m.to.r===r && m.to.c===c)
                if(move) sq.classList.add('valid')
                if(move && move.capture) sq.classList.add('capture-hint')

                const p = this.game.board[r][c]
                if(p !== C.EMPTY) {
                    const el = document.createElement('div')
                    el.className = `piece ${this.game.isPlayer(p, C.WHITE)?'white':'black'} ${p>2?'king':''}`
                    if(this.selected && this.selected.r===r && this.selected.c===c) el.classList.add('selected')
                    sq.appendChild(el)
                }
                this.uiBoard.appendChild(sq)
            }
        }
    },

    onClick(r, c) {
        if(this.isAiThinking || this.game.gameOver) return

        const p = this.game.board[r][c]

       
        if(this.game.isPlayer(p, C.WHITE)) {
            const allMoves = this.game.getMoves(C.WHITE)
            // If capture exists globally, we can only select pieces that capture
            const movesForPiece = allMoves.filter(m => m.from.r===r && m.from.c===c)
            
            if(movesForPiece.length > 0) {
                this.selected = {r,c}
                this.validMoves = movesForPiece
                AudioEng.sfx('move')
                this.drawBoard()
            } else {
                // If clicked piece has no moves but is ours
                if(!this.game.chainPiece) {
                    this.selected = null
                    this.validMoves = []
                    this.drawBoard()
                } else {
                    this.toast("CAPTURA OBRIGATÓRIA!")
                    AudioEng.sfx('error')
                }
            }
            return
        }

      
        if(this.selected) {
            const move = this.validMoves.find(m => m.to.r===r && m.to.c===c)
            if(move) {
                this.executeMove(move)
            } else {
                // Clicked invalid empty square
                if(!this.game.chainPiece) {
                    this.selected = null
                    this.validMoves = []
                    this.drawBoard()
                }
            }
        }
    },

    executeMove(move) {
        const res = this.game.doMove(move)
        
        // Feedback
        if(res.promoted) AudioEng.sfx('king')
        else if(res.captured) AudioEng.sfx('capture')
        else AudioEng.sfx('move')

        this.updateHUD()

        if(res.chain) {
            this.selected = {r:move.to.r, c:move.to.c}
            this.validMoves = this.game.getMoves(C.WHITE) 
            this.toast("CONTINUE CAPTURANDO!")
            this.drawBoard()
        } else {
            this.selected = null
            this.validMoves = []
            this.drawBoard()
            
            document.getElementById('turn-txt').innerText = "VEZ DA I.A."
            this.isAiThinking = true
            setTimeout(() => this.runAI(), 800)
        }
    },

    runAI() {
        if(this.game.gameOver) return

        
        const aiMoves = this.game.getMoves(C.BLACK)
        if(aiMoves.length === 0) {
            this.endGame(true)
            return
        }

        const best = AI.getBestMove(this.game, this.difficulty)
        const res = this.game.doMove(best)

        if(res.promoted) AudioEng.sfx('king')
        else if(res.captured) AudioEng.sfx('capture')
        else AudioEng.sfx('move')

        this.updateHUD()

        if(res.chain) {
            setTimeout(() => this.runAI(), 600)
        } else {
            this.isAiThinking = false
            document.getElementById('turn-txt').innerText = "SUA VEZ"
            this.drawBoard()
           
            if(this.game.getMoves(C.WHITE).length === 0) {
                this.endGame(false)
            }
        }
    },

    undo() {
        if(this.isAiThinking || this.game.gameOver || this.game.chainPiece) {
            this.toast("NÃO PODE DESFAZER AGORA")
            return
        }
        if(this.difficulty === 'hard') {
            this.toast("SEM UNDO NO MODO LENDA")
            return
        }
        if(this.game.undo()) {
            
            if(this.game.turn === C.BLACK) this.game.undo()
            
            this.selected = null
            this.validMoves = []
            this.drawBoard()
            this.updateHUD()
            this.toast("VOLTOU")
        }
    },

    hint() {
        if(this.game.turn !== C.WHITE) return
        const best = AI.getBestMove(this.game, 'hard') 
        if(best) {
            this.selected = best.from
            this.validMoves = [best]
            this.drawBoard()
            this.toast("MELHOR JOGADA DESTACADA")
        }
    },

    updateHUD() {
        document.getElementById('hud-pl').innerText = this.game.whitePieces
        document.getElementById('hud-ai').innerText = this.game.blackPieces
    },

    endGame(win) {
        this.game.gameOver = true
        document.getElementById('modal-result').classList.add('active')
        
        const title = document.getElementById('res-title')
        const xpTxt = document.getElementById('xp-gain')
        const bar = document.getElementById('res-xp-bar')
        
        if(win) {
            AudioEng.sfx('win')
            title.innerText = "VITÓRIA"
            title.className = "result-title win"
            const xp = this.difficulty==='hard'?300 : (this.difficulty==='medium'?150 : 50)
            xpTxt.innerText = `+${xp} XP`
            Store.addXP(xp)
        } else {
            AudioEng.sfx('lose')
            title.innerText = "DERROTA"
            title.className = "result-title lose"
            xpTxt.innerText = "+10 XP"
            Store.addXP(10)
        }
        const lvlCap = Store.data.level * 100
        const pct = (Store.data.xp / lvlCap) * 100
        setTimeout(()=> bar.style.width = `${pct}%`, 500)
    },

    toast(msg) {
        const t = document.getElementById('toast')
        t.innerText = msg
        t.classList.add('show')
        setTimeout(()=>t.classList.remove('show'), 2000)
    },
    
    renderMenu() {
        Store.updateUI()
    }
}
App.init()
</script>
</body>
</html>
