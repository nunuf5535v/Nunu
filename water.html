<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NUNU AKAME API</title>
<style>
  body {
    font-family: Arial, sans-serif;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    height: 100vh;
    margin: 0;
    background: linear-gradient(45deg, var(--color1), var(--color2), var(--color3), var(--color4));
    background-size: 400% 400%;
    animation: gradientBG 15s ease infinite;
    transition: all 0.5s ease;
  }
  @keyframes gradientBG {
    0% { background-position: 0% 50%; }
    50% { background-position: 100% 50%; }
    100% { background-position: 0% 50%; }
  }
  @keyframes winPulse {
    0% { transform: scale(1); }
    50% { transform: scale(1.1); }
    100% { transform: scale(1); }
  }
  .win-animation {
    animation: winPulse 0.5s ease-in-out 3;
  }
  @keyframes ripple {
    0% { transform: scale(1); opacity: 1; }
    100% { transform: scale(1.5); opacity: 0; }
  }
  .ripple {
    position: absolute;
    border: 2px solid #fff;
    border-radius: 50%;
    animation: ripple 0.5s linear;
    pointer-events: none;
  }
  #game-container {
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    gap: 20px;
    margin-bottom: 20px;
  }
  .tube {
    width: 60px;
    height: 200px;
    background-color: rgba(255, 255, 255, 0.7);
    border: 2px solid #333;
    border-radius: 0 0 15px 15px;
    display: flex;
    flex-direction: column-reverse;
    overflow: hidden;
    cursor: pointer;
    transition: transform 0.2s, box-shadow 0.2s;
  }
  .tube:hover {
    transform: scale(1.05);
    box-shadow: 0 0 10px rgba(0, 0, 0, 0.2);
  }
  .liquid {
    height: 25%;
    transition: all 0.3s ease-in-out;
  }
  #moves {
    margin-top: 20px;
    font-size: 18px;
  }
  .button {
    margin: 10px;
    padding: 10px 20px;
    font-size: 16px;
    background-color: #4CAF50;
    color: white;
    border: none;
    border-radius: 5px;
    cursor: pointer;
    transition: background-color 0.3s;
  }
  .button:hover {
    background-color: #45a049;
  }
  #add-tube {
    background-color: #3498db;
    width: 40px;
    height: 40px;
    border-radius: 50%;
    padding: 0;
    font-size: 24px;
    line-height: 40px;
    text-align: center;
  }
  #add-tube:hover {
    background-color: #2980b9;
  }
  #change-bg {
    position: fixed;
    top: 10px;
    right: 10px;
    background-color: #9b59b6;
    width: 40px;
    height: 40px;
    border-radius: 50%;
    padding: 0;
    font-size: 24px;
    line-height: 40px;
    text-align: center;
  }
  #change-bg:hover {
    background-color: #8e44ad;
  }
  #change-bottle {
    position: fixed;
    top: 10px;
    left: 10px;
    background-color: #3498db;
    width: 40px;
    height: 40px;
    border-radius: 50%;
    padding: 0;
    font-size: 24px;
    line-height: 40px;
    text-align: center;
  }
  #change-bottle:hover {
    background-color: #2980b9;
  }
  .tube-square {
    border-radius: 0 0 5px 5px;
  }
  .tube-round {
    border-radius: 0 0 30px 30px;
  }
  #level-counter {
    position: fixed;
    top: 10px;
    left: 50%;
    transform: translateX(-50%);
    background-color: #f39c12;
    color: white;
    padding: 5px 15px;
    border-radius: 20px;
    font-size: 18px;
    font-weight: bold;
  }
  #language-buttons {
    position: fixed;
    top: 50%;
    right: 10px;
    display: flex;
    flex-direction: column;
    gap: 5px;
    transform: translateY(-50%);
  }
  .lang-button {
    background-color: #34495e;
    color: white;
    border: none;
    border-radius: 5px;
    padding: 5px 10px;
    cursor: pointer;
    font-size: 14px;
    transition: background-color 0.3s;
    width: 40px;
  }
  .lang-button:hover {
    background-color: #2c3e50;
  }
  .modal {
    display: none;
    position: fixed;
    z-index: 1;
    left: 0;
    top: 0;
    width: 100%;
    height: 100%;
    background-color: rgba(0,0,0,0.4);
  }
  .modal-content {
    background-color: #fefefe;
    margin: 15% auto;
    padding: 20px;
    border: 1px solid #888;
    width: 80%;
    max-width: 500px;
    text-align: center;
    border-radius: 10px;
  }
  #cute-girl {
    display: block;
    margin: 0 auto;
  }
  #cute-girl.hidden {
    display: none;
  }
  @keyframes clap {
    0%, 100% { transform: rotate(0deg); }
    50% { transform: rotate(10deg); }
  }
  #left-hand {
    transform-origin: 80px 120px;
    animation: clap 0.5s infinite;
  }
  #right-hand {
    transform-origin: 120px 120px;
    animation: clap 0.5s infinite reverse;
  }
</style>
</head>
<body>
<div id="level-counter">Level: 1</div>
<h1 id="title">Water Sort Puzzle</h1>
<div id="game-container"></div>
<div id="moves">Moves: 0</div>
<div>
  <button id="reset" class="button">Reset Game</button>
  <button id="add-tube" class="button" title="Add Extra Bottle">+</button>
</div>
<button id="change-bg" class="button" title="Change Background">🎨</button>
<button id="change-bottle" class="button" title="Change Bottle Type">🧪</button>
<div id="language-buttons">
  <button class="lang-button" onclick="changeLanguage('en')">EN</button>
  <button class="lang-button" onclick="changeLanguage('es')">ES</button>
  <button class="lang-button" onclick="changeLanguage('fr')">FR</button>
  <button class="lang-button" onclick="changeLanguage('de')">DE</button>
  <button class="lang-button" onclick="changeLanguage('it')">IT</button>
  <button class="lang-button" onclick="changeLanguage('pt')">PT</button>
  <button class="lang-button" onclick="changeLanguage('ar')">AR</button>
  <button class="lang-button" onclick="changeLanguage('ru')">RU</button>
  <button class="lang-button" onclick="changeLanguage('zh')">ZH</button>
  <button class="lang-button" onclick="changeLanguage('ja')">JA</button>
</div>
<div id="win-modal" class="modal">
  <div class="modal-content">
    <h2 id="win-message"></h2>
    <svg id="cute-girl" class="hidden" width="200" height="200" viewBox="0 0 200 200">
      <circle cx="100" cy="80" r="50" fill="#FFD700"/>
      <circle cx="80" cy="70" r="5" fill="#000"/>
      <circle cx="120" cy="70" r="5" fill="#000"/>
      <path d="M85 100 Q100 120 115 100" fill="none" stroke="#000" stroke-width="3"/>
      <g id="left-hand">
        <circle cx="60" cy="140" r="20" fill="#FFD700"/>
      </g>
      <g id="right-hand">
        <circle cx="140" cy="140" r="20" fill="#FFD700"/>
      </g>
    </svg>
    <button id="next-level" class="button">Next Level</button>
  </div>
</div>
<script>
const colors = ['#ff0000', '#00ff00', '#0000ff', '#ffff00', '#ff00ff', '#00ffff'];
let numTubes = 8;
const tubeCapacity = 4;
let tubes = [];
let selectedTube = null;
let moves = 0;
let bottleType = 'round';
let level = 1;
let currentLanguage = 'en';

const gradients = [
  ['#ee7752', '#e73c7e', '#23a6d5', '#23d5ab'],
  ['#ff9a9e', '#fad0c4', '#fad0c4', '#a18cd1'],
  ['#ffecd2', '#fcb69f', '#ff9a9e', '#fecfef'],
  ['#a1c4fd', '#c2e9fb', '#d4fc79', '#96e6a1'],
  ['#84fab0', '#8fd3f4', '#cfd9df', '#e2ebf0']
];

const translations = {
  en: {
    title: "Water Sort Puzzle",
    moves: "Moves",
    level: "Level",
    resetGame: "Reset Game",
    addBottle: "Add Extra Bottle",
    changeBackground: "Change Background",
    changeBottleType: "Change Bottle Type",
    maxBottles: "Maximum number of bottles reached!",
    congratulations: "Congratulations! You solved the puzzle in {moves} moves!"
  },
  es: {
    title: "Rompecabezas de Clasificación de Agua",
    moves: "Movimientos",
    level: "Nivel",
    resetGame: "Reiniciar Juego",
    addBottle: "Añadir Botella Extra",
    changeBackground: "Cambiar Fondo",
    changeBottleType: "Cambiar Tipo de Botella",
    maxBottles: "¡Número máximo de botellas alcanzado!",
    congratulations: "¡Felicidades! Resolviste el rompecabezas en {moves} movimientos."
  },
  fr: {
    title: "Puzzle de Tri d'Eau",
    moves: "Coups",
    level: "Niveau",
    resetGame: "Réinitialiser le Jeu",
    addBottle: "Ajouter une Bouteille",
    changeBackground: "Changer l'Arrière-plan",
    changeBottleType: "Changer le Type de Bouteille",
    maxBottles: "Nombre maximum de bouteilles atteint !",
    congratulations: "Félicitations ! Vous avez résolu le puzzle en {moves} coups !"
  },
  de: {
    title: "Wasser-Sortier-Puzzle",
    moves: "Züge",
    level: "Stufe",
    resetGame: "Spiel Zurücksetzen",
    addBottle: "Flasche Hinzufügen",
    changeBackground: "Hintergrund Ändern",
    changeBottleType: "Flaschentyp Ändern",
    maxBottles: "Maximale Anzahl von Flaschen erreicht!",
    congratulations: "Glückwunsch! Sie haben das Puzzle in {moves} Zügen gelöst!"
  },
  it: {
    title: "Puzzle di Smistamento dell'Acqua",
    moves: "Mosse",
    level: "Livello",
    resetGame: "Reimposta Gioco",
    addBottle: "Aggiungi Bottiglia",
    changeBackground: "Cambia Sfondo",
    changeBottleType: "Cambia Tipo di Bottiglia",
    maxBottles: "Numero massimo di bottiglie raggiunto!",
    congratulations: "Congratulazioni! Hai risolto il puzzle in {moves} mosse!"
  },
  pt: {
    title: "Quebra-cabeça de Classificação de Água",
    moves: "Movimentos",
    level: "Nível",
    resetGame: "Reiniciar Jogo",
    addBottle: "Adicionar Garrafa Extra",
    changeBackground: "Mudar Fundo",
    changeBottleType: "Mudar Tipo de Garrafa",
    maxBottles: "Número máximo de garrafas atingido!",
    congratulations: "Parabéns! Você resolveu o quebra-cabeça em {moves} movimentos!"
  },
  ar: {
    title: "لعبة فرز المياه",
    moves: "الحركات",
    level: "المستوى",
    resetGame: "إعادة تعيين اللعبة",
    addBottle: "إضافة زجاجة إضافية",
    changeBackground: "تغيير الخلفية",
    changeBottleType: "تغيير نوع الزجاجة",
    maxBottles: "تم الوصول إلى الحد الأقصى لعدد الزجاجات!",
    congratulations: "تهانينا! لقد حللت اللغز في {moves} حركة!"
  },
  ru: {
    title: "Головоломка Сортировка Воды",
    moves: "Ходы",
    level: "Уровень",
    resetGame: "Сбросить Игру",
    addBottle: "Добавить Бутылку",
    changeBackground: "Изменить Фон",
    changeBottleType: "Изменить Тип Бутылки",
    maxBottles: "Достигнуто максимальное количество бутылок!",
    congratulations: "Поздравляем! Вы решили головоломку за {moves} ходов!"
  },
  zh: {
    title: "水分类拼图",
    moves: "移动次数",
    level: "等级",
    resetGame: "重置游戏",
    addBottle: "添加额外瓶子",
    changeBackground: "更改背景",
    changeBottleType: "更改瓶子类型",
    maxBottles: "已达到最大瓶子数量！",
    congratulations: "恭喜！你用{moves}次移动解决了这个谜题！"
  },
  ja: {
    title: "ウォーターソートパズル",
    moves: "移動回数",
    level: "レベル",
    resetGame: "ゲームをリセット",
    addBottle: "ボトルを追加",
    changeBackground: "背景を変更",
    changeBottleType: "ボトルタイプを変更",
    maxBottles: "ボトルの最大数に達しました！",
    congratulations: "おめでとうございます！{moves}回の移動でパズルを解きました！"
  }
};

function setRandomBackground() {
  const randomGradient = gradients[Math.floor(Math.random() * gradients.length)];
  document.documentElement.style.setProperty('--color1', randomGradient[0]);
  document.documentElement.style.setProperty('--color2', randomGradient[1]);
  document.documentElement.style.setProperty('--color3', randomGradient[2]);
  document.documentElement.style.setProperty('--color4', randomGradient[3]);
}

function initGame() {
  tubes = [];
  for (let i = 0; i < numTubes; i++) {
    tubes.push([]);
  }
  
  const totalLiquids = (numTubes - 2) * tubeCapacity;
  const liquidsPerColor = Math.floor(totalLiquids / colors.length);
  
  let remainingLiquids = colors.flatMap(color => Array(liquidsPerColor).fill(color));
  
  while (remainingLiquids.length < totalLiquids) {
    remainingLiquids.push(colors[Math.floor(Math.random() * colors.length)]);
  }
  
  for (let i = 0; i < numTubes - 2; i++) {
    while (tubes[i].length < tubeCapacity) {
      const randomIndex = Math.floor(Math.random() * remainingLiquids.length);
      const [liquid] = remainingLiquids.splice(randomIndex, 1);
      tubes[i].push(liquid);
    }
  }
  
  setRandomBackground();
  renderTubes();
  updateMoves();
  updateLevel();
}

function renderTubes() {
  const gameContainer = document.getElementById('game-container');
  gameContainer.innerHTML = '';
  
  tubes.forEach((tube, index) => {
    const tubeElement = document.createElement('div');
    tubeElement.className = `tube tube-${bottleType}`;
    tubeElement.onclick = () => selectTube(index);
    
    tube.forEach(color => {
      const liquidElement = document.createElement('div');
      liquidElement.className = 'liquid';
      liquidElement.style.backgroundColor = color;
      tubeElement.appendChild(liquidElement);
    });
    
    gameContainer.appendChild(tubeElement);
  });
}

function selectTube(index) {
  if (selectedTube === null) {
    if (tubes[index].length > 0) {
      selectedTube = index;
      document.getElementsByClassName('tube')[index].style.border = '2px solid #ff8c00';
    }
  } else {
    if (selectedTube !== index) {
      pourLiquid(selectedTube, index);
    }
    document.getElementsByClassName('tube')[selectedTube].style.border = '2px solid #333';
    selectedTube = null;
  }
}

function pourLiquid(fromIndex, toIndex) {
  const fromTube = tubes[fromIndex];
  const toTube = tubes[toIndex];
  
  if (fromTube.length === 0 || toTube.length === tubeCapacity) return;
  
  const colorToPour = fromTube[fromTube.length - 1];
  let amountToPour = 0;
  
  for (let i = fromTube.length - 1; i >= 0; i--) {
    if (fromTube[i] === colorToPour) {
      amountToPour++;
    } else {
      break;
    }
  }
  
  const spaceAvailable = tubeCapacity - toTube.length;
  const actualPour = Math.min(amountToPour, spaceAvailable);
  
  if (toTube.length === 0 || toTube[toTube.length - 1] === colorToPour) {
    const fromTubeElement = document.getElementsByClassName('tube')[fromIndex];
    const toTubeElement = document.getElementsByClassName('tube')[toIndex];

    for (let i = 0; i < actualPour; i++) {
      const liquidElement = fromTubeElement.lastElementChild;
      liquidElement.style.transition = 'transform 0.5s';
      liquidElement.style.transform = `translateY(-${200 + i * 50}px)`;

      setTimeout(() => {
        fromTubeElement.removeChild(liquidElement);
        liquidElement.style.transform = '';
        toTubeElement.appendChild(liquidElement);
        
        const ripple = document.createElement('div');
        ripple.className = 'ripple';
        ripple.style.width = '40px';
        ripple.style.height = '40px';
        ripple.style.left = `${toTubeElement.offsetLeft + 10}px`;
        ripple.style.top = `${toTubeElement.offsetTop + toTubeElement.offsetHeight - (toTube.length + 1) * 50}px`;
        document.body.appendChild(ripple);
        
        setTimeout(() => {
          document.body.removeChild(ripple);
        }, 500);
      }, 500);

      toTube.push(fromTube.pop());
    }

    moves++;
    updateMoves();
    setTimeout(renderTubes, 600);
    setTimeout(checkWinCondition, 600);
  }
}

function updateMoves() {
  document.getElementById('moves').textContent = `${translations[currentLanguage].moves}: ${moves}`;
}

function updateLevel() {
  document.getElementById('level-counter').textContent = `${translations[currentLanguage].level}: ${level}`;
}

function checkWinCondition() {
  const isWin = tubes.every(tube => tube.length === 0 || tube.length === tubeCapacity && tube.every(color => color === tube[0]));
  if (isWin) {
    const tubeElements = document.getElementsByClassName('tube');
    Array.from(tubeElements).forEach(tube => {
      tube.classList.add('win-animation');
    });

    setTimeout(() => {
      const modal = document.getElementById('win-modal');
      const winMessage = document.getElementById('win-message');
      winMessage.textContent = translations[currentLanguage].congratulations.replace('{moves}', moves);
      modal.style.display = 'block';

      const cuteGirl = document.getElementById('cute-girl');
      cuteGirl.classList.remove('hidden');

      document.getElementById('next-level').onclick = () => {
        modal.style.display = 'none';
        cuteGirl.classList.add('hidden');
        level++;
        updateLevel();
        resetGame();
      };
    }, 1500);
  }
}

function addExtraBottle() {
  if (numTubes < 12) {
    numTubes++;
    tubes.push([]);
    renderTubes();
  } else {
    alert(translations[currentLanguage].maxBottles);
  }
}

function changeBackground() {
  setRandomBackground();
}

function changeBottleType() {
  bottleType = bottleType === 'round' ? 'square' : 'round';
  renderTubes();
}

function resetGame() {
  moves = 0;
  selectedTube = null;
  numTubes = 8;
  initGame();
}

function changeLanguage(lang) {
  currentLanguage = lang;
  document.getElementById('title').textContent = translations[lang].title;
  document.getElementById('reset').textContent = translations[lang].resetGame;
  document.getElementById('add-tube').title = translations[lang].addBottle;
  document.getElementById('change-bg').title = translations[lang].changeBackground;
  document.getElementById('change-bottle').title = translations[lang].changeBottleType;
  updateMoves();
  updateLevel();

  if (lang === 'ar') {
    document.body.style.direction = 'rtl';
  } else {
    document.body.style.direction = 'ltr';
  }
}

document.getElementById('reset').addEventListener('click', () => {
  level = 1;
  updateLevel();
  resetGame();
});

document.getElementById('add-tube').addEventListener('click', addExtraBottle);
document.getElementById('change-bg').addEventListener('click', changeBackground);
document.getElementById('change-bottle').addEventListener('click', changeBottleType);

initGame();
</script>
</body></html>
