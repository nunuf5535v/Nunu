<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Campo Minado Deluxe</title>
  <base href="https://campominadodeluxe.com">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --primary: #4a90e2;
      --secondary: #f39c12;
      --bg: #1a252f;
      --text: #ecf0f1;
      --cell: 40px;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Poppins', sans-serif;
      background: var(--bg);
      color: var(--text);
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 1rem;
    }

    .container {
      background: rgba(255, 255, 255, 0.08);
      border-radius: 20px;
      box-shadow: 0 8px 20px rgba(0, 0, 0, 0.5);
      padding: 2rem;
      text-align: center;
      width: 100%;
      max-width: 400px;
    }

    h1 {
      font-size: 2.5rem;
      color: var(--secondary);
      margin-bottom: 1rem;
      text-shadow: 2px 2px 6px rgba(0,0,0,0.3);
    }

    #controls {
      display: flex;
      justify-content: center;
      flex-wrap: wrap;
      gap: 10px;
      margin-bottom: 1rem;
    }

    select, button {
      background: var(--primary);
      border: none;
      color: white;
      padding: 10px 15px;
      font-size: 1rem;
      border-radius: 8px;
      cursor: pointer;
      transition: transform 0.2s, background 0.3s;
    }

    select:hover, button:hover {
      background: #357abd;
      transform: translateY(-2px);
    }

    #gameboard {
      display: grid;
      gap: 5px;
      justify-content: center;
      margin-top: 20px;
    }

    .cell {
      width: var(--cell);
      height: var(--cell);
      background: rgba(255,255,255,0.1);
      border: 2px solid rgba(255,255,255,0.2);
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: bold;
      font-size: 18px;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .cell:hover {
      background: rgba(255,255,255,0.2);
      transform: scale(1.05);
    }

    .cell.revealed {
      background: rgba(255,255,255,0.3);
      cursor: default;
    }

    .cell.mine {
      background: #e74c3c;
      color: white;
    }

    #status {
      margin-top: 20px;
      font-size: 1.2rem;
      font-weight: 600;
    }

    @media (max-width: 480px) {
      :root { --cell: 30px; }
      h1 { font-size: 2rem; }
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>🇲🇨 Campo Minado</h1>
    <div id="controls">
      <select id="difficulty" onchange="changedifficulty()">
        <option value="easy">Fácil</option>
        <option value="medium">Médio</option>
        <option value="hard">Difícil</option>
      </select>
      <button onclick="newgame()">Novo Jogo</button>
    </div>
    <div id="gameboard"></div>
    <div id="status">MONACO UNIVERS 🇲🇨</div>
  </div>

  <script>
    let boardsize, nummines;
    let board = [], revealed = [];
    let gameover = false, firstclick = true;

    function setdifficulty(level) {
      if (level === 'easy') { boardsize = 8; nummines = 10; }
      else if (level === 'medium') { boardsize = 12; nummines = 30; }
      else if (level === 'hard') { boardsize = 16; nummines = 60; }
    }

    function changedifficulty() {
      const level = document.getElementById('difficulty').value;
      setdifficulty(level);
      newgame();
    }

    function createboard() {
      board = Array.from({ length: boardsize }, () => Array(boardsize).fill(0));
      revealed = Array.from({ length: boardsize }, () => Array(boardsize).fill(false));
      firstclick = true;
    }

    function placemines(clickrow, clickcol) {
      let placed = 0;
      while (placed < nummines) {
        const row = Math.floor(Math.random() * boardsize);
        const col = Math.floor(Math.random() * boardsize);
        if (board[row][col] !== 'M' && (row !== clickrow || col !== clickcol)) {
          board[row][col] = 'M';
          placed++;
        }
      }
      for (let row = 0; row < boardsize; row++) {
        for (let col = 0; col < boardsize; col++) {
          if (board[row][col] !== 'M') board[row][col] = countadjacentmines(row, col);
        }
      }
    }

    function countadjacentmines(row, col) {
      let count = 0;
      for (let i = -1; i <= 1; i++) {
        for (let j = -1; j <= 1; j++) {
          const r = row + i, c = col + j;
          if (r >= 0 && r < boardsize && c >= 0 && c < boardsize && board[r][c] === 'M') count++;
        }
      }
      return count;
    }

    function revealcell(row, col) {
      if (revealed[row][col] || gameover) return;
      if (firstclick) { placemines(row, col); firstclick = false; }

      revealed[row][col] = true;
      const cell = document.getElementById(`cell-${row}-${col}`);
      cell.classList.add('revealed');

      if (board[row][col] === 'M') {
        cell.textContent = '💣';
        cell.classList.add('mine');
        gameover = true;
        revealallmines();
        document.getElementById('status').textContent = 'Fim de jogo! Você perdeu.';
      } else if (board[row][col] === 0) {
        cell.textContent = '';
        for (let i = -1; i <= 1; i++) {
          for (let j = -1; j <= 1; j++) {
            const r = row + i, c = col + j;
            if (r >= 0 && r < boardsize && c >= 0 && c < boardsize) revealcell(r, c);
          }
        }
      } else {
        cell.textContent = board[row][col];
      }

      checkwin();
    }

    function revealallmines() {
      for (let row = 0; row < boardsize; row++) {
        for (let col = 0; col < boardsize; col++) {
          if (board[row][col] === 'M') {
            const cell = document.getElementById(`cell-${row}-${col}`);
            cell.textContent = '💣';
            cell.classList.add('revealed', 'mine');
          }
        }
      }
    }

    function checkwin() {
      let safeunrevealed = 0;
      for (let row = 0; row < boardsize; row++) {
        for (let col = 0; col < boardsize; col++) {
          if (!revealed[row][col] && board[row][col] !== 'M') safeunrevealed++;
        }
      }
      if (safeunrevealed === 0) {
        gameover = true;
        document.getElementById('status').textContent = 'Parabéns! Você ganhou!';
      }
    }

    function renderboard() {
      const gameboard = document.getElementById('gameboard');
      gameboard.innerHTML = '';
      gameboard.style.gridTemplateColumns = `repeat(${boardsize}, 1fr)`;
      for (let row = 0; row < boardsize; row++) {
        for (let col = 0; col < boardsize; col++) {
          const cell = document.createElement('div');
          cell.id = `cell-${row}-${col}`;
          cell.className = 'cell';
          cell.onclick = () => revealcell(row, col);
          gameboard.appendChild(cell);
        }
      }
    }

    function newgame() {
      gameover = false;
      document.getElementById('status').textContent = 'MONACO UNIVERS 🇲🇨';
      createboard();
      renderboard();
    }

    setdifficulty('easy');
    newgame();
  </script>
</body>
</html>
