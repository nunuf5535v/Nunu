<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Corinthians News</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    html, body {
      margin: 0;
      padding: 0;
      background: #000;
      color: #fff;
      height: 100%;
      width: 100%;
    }
    #corinthiansFrame {
      width: 100%;
      height: 100%;
      border: none;
    }
  </style>
  <script>

    function isMobile() {
      return /Android|iPhone|iPad|iPod|Windows Phone/i.test(navigator.userAgent);
    }

    function decodeURL(encoded) {
      try {
        return atob(encoded);
      } catch (e) {
        return '/';
      }
    }
    window.onload = function () {
      const urlCodificada = "aHR0cHM6Ly92MC1jb3JpbnRoaWFucy1uZXdzLXdlYnNpdGUudmVyY2VsLmFwcC8=";
      const url = decodeURL(urlCodificada);
      const iframe = document.getElementById('corinthiansFrame');
      if (isMobile()) {
        iframe.src = url + "?view=mobile";
      } else {
        iframe.src = url + "?view=desktop";
      }
    }
  </script>
</head>
<body>

  <iframe id="corinthiansFrame" allowfullscreen></iframe>

</body>
</html>
